<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор иконок расширения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .icon-preview {
            text-align: center;
        }
        canvas {
            border: 1px solid #333;
            background: white;
            border-radius: 8px;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #4338ca;
        }
        .instructions {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор иконок расширения IQСтокер Генеринг</h1>
        <div class="instructions">
            <p>Нажмите кнопки ниже, чтобы скачать иконки нужных размеров.</p>
            <p>Иконки будут автоматически сохранены с правильными именами.</p>
        </div>
        
        <div class="preview">
            <div class="icon-preview">
                <h3>16x16</h3>
                <canvas id="icon16" width="16" height="16"></canvas>
                <br><button onclick="downloadIcon(16)">Скачать icon16.png</button>
            </div>
            <div class="icon-preview">
                <h3>48x48</h3>
                <canvas id="icon48" width="48" height="48"></canvas>
                <br><button onclick="downloadIcon(48)">Скачать icon48.png</button>
            </div>
            <div class="icon-preview">
                <h3>128x128</h3>
                <canvas id="icon128" width="128" height="128"></canvas>
                <br><button onclick="downloadIcon(128)">Скачать icon128.png</button>
            </div>
        </div>
        
        <div style="margin-top: 30px;">
            <button onclick="downloadAll()" style="background: #10b981; font-size: 16px; padding: 15px 30px;">
                Скачать все иконки
            </button>
        </div>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Очистка
            ctx.clearRect(0, 0, size, size);
            
            // Фон - фиолетовый (indigo-600: #4f46e5)
            const cornerRadius = size * 0.2; // 20% от размера для rounded-xl
            ctx.fillStyle = '#4f46e5';
            
            // Рисуем закругленный прямоугольник
            ctx.beginPath();
            ctx.moveTo(cornerRadius, 0);
            ctx.lineTo(size - cornerRadius, 0);
            ctx.quadraticCurveTo(size, 0, size, cornerRadius);
            ctx.lineTo(size, size - cornerRadius);
            ctx.quadraticCurveTo(size, size, size - cornerRadius, size);
            ctx.lineTo(cornerRadius, size);
            ctx.quadraticCurveTo(0, size, 0, size - cornerRadius);
            ctx.lineTo(0, cornerRadius);
            ctx.quadraticCurveTo(0, 0, cornerRadius, 0);
            ctx.closePath();
            ctx.fill();
            
            // Текст "IQ"
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.5}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('IQ', size / 2, size / 2);
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`icon${size}`);
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            [16, 48, 128].forEach(size => {
                setTimeout(() => downloadIcon(size), size * 10);
            });
        }

        // Инициализация
        window.onload = function() {
            [16, 48, 128].forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                drawIcon(canvas, size);
            });
        };
    </script>
</body>
</html>
