version: '3.8'

# Мониторинг стек: Prometheus + Grafana
services:
  # Prometheus - сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: iqstocker-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - iqstocker-network

  # Grafana - визуализация
  grafana:
    image: grafana/grafana:latest
    container_name: iqstocker-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - iqstocker-network

  # Node Exporter - системные метрики
  node-exporter:
    image: prom/node-exporter:latest
    container_name: iqstocker-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - iqstocker-network

  # Postgres Exporter (опционально)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: iqstocker-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iqstocker_db}?sslmode=disable"
    networks:
      - iqstocker-network

  # Redis Exporter (опционально)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: iqstocker-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      - iqstocker-network

networks:
  iqstocker-network:
    external: true

volumes:
  prometheus_data:
  grafana_data:

