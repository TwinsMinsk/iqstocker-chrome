[tool.poetry]
name = "iqstocker-backend"
version = "1.0.0"
description = "IQStocker Backend API"
authors = ["IQStocker Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.0"
uvicorn = "0.24.0"
sqlalchemy = "2.0.23"
alembic = "1.12.1"
pydantic = "2.5.0"
pydantic-settings = "2.1.0"
python-jose = "3.3.0"
passlib = "1.7.4"
bcrypt = "3.2.0"
python-multipart = "0.0.6"
httpx = "0.25.2"
psycopg2-binary = "2.9.9"
aioredis = "2.0.1"
redis = "5.0.0"
sentry-sdk = "1.39.1"
email-validator = "2.1.0"
sendgrid = "6.10.0"
cryptography = "42.0.8"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

